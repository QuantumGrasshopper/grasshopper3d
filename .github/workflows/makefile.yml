name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: GCC
            compiler: g++
            package: g++
          - name: Clang
            compiler: clang++
            package: clang

    name: ${{ matrix.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgsl-dev ${{ matrix.package }}

      - name: Build and test
        run: make CXX=${{ matrix.compiler }} -B check
